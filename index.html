<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Dark Calculator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="calculator">
      <!-- Display -->
      <output class="calculator__display" id="display" for="buttons">0</output>

      <!-- Buttons -->
      <section class="calculator__buttons" id="buttons">
        <!-- Row 1 -->
        <div class="calculator__row" role="group">
          <button
            class="calculator__button"
            type="button"
            onclick="appendValue('1')"
            aria-label="One"
          >
            1
          </button>
          <button
            class="calculator__button"
            type="button"
            onclick="appendValue('2')"
            aria-label="Two"
          >
            2
          </button>
          <button
            class="calculator__button"
            type="button"
            onclick="appendValue('3')"
            aria-label="Three"
          >
            3
          </button>
          <button
            class="calculator__button calculator__button--operator"
            type="button"
            onclick="appendValue('/')"
            aria-label="Divide"
          >
            /
          </button>
        </div>

        <!-- Row 2 -->
        <div class="calculator__row" role="group">
          <button
            class="calculator__button"
            type="button"
            onclick="appendValue('4')"
            aria-label="Four"
          >
            4
          </button>
          <button
            class="calculator__button"
            type="button"
            onclick="appendValue('5')"
            aria-label="Five"
          >
            5
          </button>
          <button
            class="calculator__button"
            type="button"
            onclick="appendValue('6')"
            aria-label="Six"
          >
            6
          </button>
          <button
            class="calculator__button calculator__button--operator"
            type="button"
            onclick="appendValue('*')"
            aria-label="Multiply"
          >
            *
          </button>
        </div>

        <!-- Row 3 -->
        <div class="calculator__row" role="group">
          <button
            class="calculator__button"
            type="button"
            onclick="appendValue('7')"
            aria-label="Seven"
          >
            7
          </button>
          <button
            class="calculator__button"
            type="button"
            onclick="appendValue('8')"
            aria-label="Eight"
          >
            8
          </button>
          <button
            class="calculator__button"
            type="button"
            onclick="appendValue('9')"
            aria-label="Nine"
          >
            9
          </button>
          <button
            class="calculator__button calculator__button--operator"
            type="button"
            onclick="appendValue('-')"
            aria-label="Subtract"
          >
            -
          </button>
        </div>

        <!-- Row 4 -->
        <div class="calculator__row" role="group">
          <button
            class="calculator__button"
            type="button"
            onclick="appendValue('.')"
            aria-label="Decimal Point"
          >
            .
          </button>
          <button
            class="calculator__button"
            type="button"
            onclick="appendValue('0')"
            aria-label="Zero"
          >
            0
          </button>
          <button
            class="calculator__button calculator__button--equals"
            type="button"
            onclick="calculateResult()"
            aria-label="Equals"
          >
            =
          </button>
          <button
            class="calculator__button calculator__button--operator"
            type="button"
            onclick="appendValue('+')"
            aria-label="Add"
          >
            +
          </button>
        </div>

        <!-- Row 5 -->
        <div class="calculator__row" role="group">
          <button
            class="calculator__button calculator__button--clear"
            type="button"
            onclick="clearDisplay()"
            aria-label="Clear"
          >
            C
          </button>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.10.1/math.min.js"></script>
  </body>
</html>
